<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Genesys Cloud Token (PKCE)</title>
</head>
<body>
  <h2>Genesys Cloud Bearer Token</h2>
  <p id="status">Loading...</p>
  <button id="login" style="display:none">Log in to Genesys Cloud</button>

  <p>Token:</p>
  <textarea id="token" rows="4" cols="80" readonly></textarea>

  <h2>Make a Call</h2>
  <input id="phone" type="tel" placeholder="+971501234567" size="30">
  <button id="callBtn" disabled>Make Call</button>
  <h3>API Response</h3>
  <div id="callOutput">No call made yet.</div>

<script>
  const CONFIG = {
    region: "mypurecloud.ie",
    clientId: "7748b312-9ef5-4e90-803f-743f45f8dcde",
    redirectUri: "https://sherifismail.github.io/webpages/gc_makecall.html"
  };

  let accessToken = null;

  // --- PKCE helpers ---
  function randomString(len) {
    const arr = new Uint8Array(len);
    crypto.getRandomValues(arr);
    return Array.from(arr, b => ("0" + b.toString(16)).slice(-2)).join("");
  }
  function base64url(buffer) {
    return btoa(String.fromCharCode(...new Uint8Array(buffer)))
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  async function challengeFromVerifier(verifier) {
    const data = new TextEncoder().encode(verifier);
    const digest = await crypto.subtle.digest("SHA-256", data);
    return base64url(digest);
  }

  async function startLogin() {
    const verifier = randomString(48);
    sessionStorage.setItem("pkce_verifier", verifier);
    const challenge = await challengeFromVerifier(verifier);
    const params = new URLSearchParams({
      client_id: CONFIG.clientId,
      response_type: "code",
      redirect_uri: CONFIG.redirectUri,
      code_challenge: challenge,
      code_challenge_method: "S256"
    });
    window.location.href = `https://login.${CONFIG.region}/oauth/authorize?${params}`;
  }

  async function exchangeCode(code) {
    const verifier = sessionStorage.getItem("pkce_verifier");
    const body = new URLSearchParams({
      grant_type: "authorization_code",
      code: code,
      redirect_uri: CONFIG.redirectUri,
      client_id: CONFIG.clientId,
      code_verifier: verifier
    });
    const res = await fetch(`https://login.${CONFIG.region}/oauth/token`, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body
    });
    if (!res.ok) throw new Error(`Token exchange failed: ${res.status} ${await res.text()}`);
    return res.json();
  }

  function onToken(token) {
    accessToken = token;
    document.getElementById("token").value = token;
    document.getElementById("status").textContent = "Signed in.";
    document.getElementById("login").style.display = "none";
    document.getElementById("callBtn").disabled = false;
  }

  function needLogin(msg) {
    document.getElementById("status").textContent = msg || "Please log in.";
    document.getElementById("login").style.display = "inline-block";
  }

  (async function init() {
    const url = new URL(window.location.href);
    const code = url.searchParams.get("code");
    const error = url.searchParams.get("error");

    if (error) { needLogin(`Login error: ${error}`); return; }

    if (code) {
      // Clean the code out of the address bar
      history.replaceState(null, "", CONFIG.redirectUri);
      try {
        document.getElementById("status").textContent = "Exchanging code...";
        const data = await exchangeCode(code);
        onToken(data.access_token);
      } catch (e) {
        needLogin(e.message);
      }
    } else {
      needLogin("Not signed in.");
    }
  })();

  document.getElementById("login").addEventListener("click", startLogin);

  async function makeCall() {
    const out = document.getElementById("callOutput");
    const phone = document.getElementById("phone").value.trim();
    if (!/^\+?[0-9]{7,15}$/.test(phone)) {
      out.textContent = "Enter a valid number, e.g. +971501234567.";
      return;
    }
    out.textContent = "Calling...";
    try {
      const r = await fetch(`https://api.${CONFIG.region}/api/v2/conversations/calls`, {
        method: "POST",
        headers: { "Authorization": `Bearer ${accessToken}`, "Content-Type": "application/json" },
        body: JSON.stringify({ phoneNumber: phone })
      });
      out.textContent = `Status: ${r.status} ${r.statusText}\n\n${await r.text()}`;
    } catch (e) { out.textContent = `Request failed: ${e.message}`; }
  }
  document.getElementById("callBtn").addEventListener("click", makeCall);
</script>
</body>
</html>
