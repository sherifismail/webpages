<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Genesys Cloud Token (PKCE)</title>
</head>
<body>
  <!--<h2>Genesys Cloud Bearer Token</h2>-->
  <p id="status">Loading...</p>
  <button id="login" style="display:none">Log in to Genesys Cloud</button>

  <h2>Make a Call</h2>
  <p>Party ID: <span id="partyidOut">(none)</span></p>
  <input id="phone" type="tel" placeholder="+971501234567" size="30">
  <button id="callBtn" disabled>Make Call</button>
  <div id="callOutput" style="margin-top:1rem;font-weight:bold;font-size:1.1rem"></div>

<script>
  const CONFIG = {
    region: "mypurecloud.ie",                                      // your Genesys Cloud region domain
    clientId: "7748b312-9ef5-4e90-803f-743f45f8dcde",                                    // the PKCE (Code Authorization) client ID
    redirectUri: "https://sherifismail.github.io/webpages/gc_makecall.html"  // must match the OAuth client exactly
  };

  let accessToken = null;

  // --- Capture partyid from the URL as early as possible, before any redirect ---
  // The OAuth round trip to Genesys strips the original query string, so we stash
  // partyid in sessionStorage and read it back when we make the call.
  function captureParams() {
    const params = new URL(window.location.href).searchParams;
    ["partyid", "campaignid", "conversationid"].forEach(key => {
      const val = params.get(key);
      if (val) sessionStorage.setItem(key, val);
    });
    document.getElementById("partyidOut").textContent =
      sessionStorage.getItem("partyid") || "(none)";
  }

  // --- PKCE helpers ---
  function randomString(len) {
    const arr = new Uint8Array(len);
    crypto.getRandomValues(arr);
    return Array.from(arr, b => ("0" + b.toString(16)).slice(-2)).join("");
  }
  function base64url(buffer) {
    return btoa(String.fromCharCode(...new Uint8Array(buffer)))
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  async function challengeFromVerifier(verifier) {
    const data = new TextEncoder().encode(verifier);
    const digest = await crypto.subtle.digest("SHA-256", data);
    return base64url(digest);
  }

  async function startLogin() {
    const verifier = randomString(48);
    sessionStorage.setItem("pkce_verifier", verifier);
    const challenge = await challengeFromVerifier(verifier);
    const params = new URLSearchParams({
      client_id: CONFIG.clientId,
      response_type: "code",
      redirect_uri: CONFIG.redirectUri,
      code_challenge: challenge,
      code_challenge_method: "S256"
    });
    window.location.href = `https://login.${CONFIG.region}/oauth/authorize?${params}`;
  }

  async function exchangeCode(code) {
    const verifier = sessionStorage.getItem("pkce_verifier");
    const body = new URLSearchParams({
      grant_type: "authorization_code",
      code: code,
      redirect_uri: CONFIG.redirectUri,
      client_id: CONFIG.clientId,
      code_verifier: verifier
    });
    const res = await fetch(`https://login.${CONFIG.region}/oauth/token`, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body
    });
    if (!res.ok) throw new Error(`Token exchange failed: ${res.status} ${await res.text()}`);
    return res.json();
  }

  function onToken(token) {
    sessionStorage.removeItem("auto_login_tried");   // allow auto-login again on a future fresh visit
    accessToken = token;
    document.getElementById("status").textContent = "Signed in.";
    document.getElementById("login").style.display = "none";
    document.getElementById("callBtn").disabled = false;
  }

  function needLogin(msg) {
    document.getElementById("status").textContent = msg || "Please log in.";
    document.getElementById("login").style.display = "inline-block";
  }

  (async function init() {
    captureParams();   // must run first, before any redirect strips the query string

    const url = new URL(window.location.href);
    const code = url.searchParams.get("code");
    const error = url.searchParams.get("error");

    if (error) {
      needLogin(`Login error: ${error}`);
      return;
    }

    if (code) {
      history.replaceState(null, "", CONFIG.redirectUri);   // clean the code out of the address bar
      try {
        document.getElementById("status").textContent = "Exchanging code...";
        const data = await exchangeCode(code);
        onToken(data.access_token);
      } catch (e) {
        needLogin(e.message);
      }
      return;
    }

    // First visit: try signing in automatically, but only once per load to avoid a redirect loop.
    if (!sessionStorage.getItem("auto_login_tried")) {
      sessionStorage.setItem("auto_login_tried", "1");
      startLogin();
    } else {
      needLogin("Couldn't sign in automatically.");
    }
  })();

  document.getElementById("login").addEventListener("click", startLogin);

  // --- Set the external tag on a conversation (PUT /api/v2/conversations/{id}/tags) ---
  async function setExternalTag(conversationId, tagValue) {
    const res = await fetch(
      `https://api.${CONFIG.region}/api/v2/conversations/${conversationId}/tags`,
      {
        method: "PUT",
        headers: { "Authorization": `Bearer ${accessToken}`, "Content-Type": "application/json" },
        body: JSON.stringify({ externalTag: tagValue })
      }
    );
    return { status: res.status, statusText: res.statusText, ok: res.ok, text: await res.text() };
  }

  function showStatus(msg, color) {
    const out = document.getElementById("callOutput");
    out.textContent = msg;
    out.style.color = color || "inherit";
  }

  async function makeCall() {
    const out = document.getElementById("callOutput");
    const phone = document.getElementById("phone").value.trim();
    // Accept E.164 (+ then digits) or UAE local formats like 0501234567 / 042345678.
    if (!/^\+?[0-9]{7,15}$/.test(phone)) {
      showStatus("Enter a valid number, e.g. +971501234567, 0501234567, or 042345678.", "#b00");
      return;
    }

    // Build the request body. Only include attributes if we actually have a partyid.
    const requestBody = { phoneNumber: phone };
    const partyId = sessionStorage.getItem("partyid");
    const campaignId = sessionStorage.getItem("campaignid");
    const mainConversationId = sessionStorage.getItem("conversationid");
    if (partyId != null && campaignId != null && mainConversationId != null) {
      requestBody.attributes = { partyid: partyId,
                                campaignid:campaignId,
                                mainConversationid:mainConversationId
                               };
    }

    showStatus("Calling...", "#555");
    try {
      const r = await fetch(`https://api.${CONFIG.region}/api/v2/conversations/calls`, {
        method: "POST",
        headers: { "Authorization": `Bearer ${accessToken}`, "Content-Type": "application/json" },
        body: JSON.stringify(requestBody)
      });
      const callText = await r.text();

      if (!r.ok) {
        showStatus("Call failed.", "#b00");
        return;
      }

      // Tag the new call with the conversationid passed in the URL (as the external tag value).
      if (mainConversationId) {
        let newConversationId = null;
        try { newConversationId = JSON.parse(callText).id; } catch (_) {}
        if (newConversationId) {
          await setExternalTag(newConversationId, mainConversationId);
        }
      }

      showStatus("Call placed.", "#0a7d00");
    } catch (e) { showStatus("Call failed.", "#b00"); }
  }
  document.getElementById("callBtn").addEventListener("click", makeCall);
</script>
</body>
</html>
